{% extends 'base.html' %}

{% block title %}Отмена записи{% endblock %}

{% block content %}
<div class="container my-5">
    <h1>Отмена записи</h1>
    <p>Вы уверены, что хотите отменить запись к {{ appointment.doctor.full_name }} на {{ appointment.date }}?</p>
    
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Да, отменить</button>
        <a href="{% url 'appointments:my' %}" class="btn btn-secondary">Нет, вернуться</a>
    </form>
</div>
{% endblock %}
